name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_prototype:
        description: Publish the signed APK to the v0.1.1 GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

env:
  APK_NAME: RetroCase-v0.1.1-Prototype.apk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/retrocase-android-sdk"
          tmp="$(mktemp -d)"
          mkdir -p "$sdk/platforms" "$sdk/build-tools"
          cd "$tmp"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/platform-35_r02.zip -o platform.zip
          curl -fsSL --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o build-tools.zip
          sha256sum --check <<'CHECKSUMS'
          0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  platform.zip
          bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  build-tools.zip
          CHECKSUMS
          unzip -q platform.zip -d "$sdk/platforms"
          unzip -q build-tools.zip
          mv android-15 "$sdk/build-tools/35.0.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Validate case data
        run: python3 tools/validate_case.py
      - name: Build the APK
        run: bash tools/build_apk.sh "dist/$APK_NAME"
      - name: Verify signature and package metadata
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          cd dist
          "$tools/apksigner" verify --verbose --print-certs "$APK_NAME" | tee apk-signature.txt
          "$tools/zipalign" -c -v 4 "$APK_NAME"
          "$tools/aapt" dump badging "$APK_NAME" | tee apk-metadata.txt
          grep -F "package: name='org.retrocase.engine' versionCode='2' versionName='0.1.1 Prototype'" apk-metadata.txt
          grep -F "launchable-activity: name='org.retrocase.engine.MainActivity'" apk-metadata.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: RetroCase-v0.1.1-Prototype
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prototype && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RetroCase-v0.1.1-Prototype
          path: dist
      - name: Publish the verified prototype
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$APK_NAME.sha256")
          gh release create v0.1.1 --target "$GITHUB_SHA" \
            --prerelease --title "RetroCase v0.1.1 Prototype" \
            --notes-file docs/release-v0.1.1.md \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256" docs/RetroCase-v0.1.1-Poster.png
